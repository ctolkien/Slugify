name: Slugify Actions

on:
  push:
    branches:
      - main
  pull_request:

  # Publishing a GitHub release (tag e.g. 5.1.3) ships that version to nuget.org.
  release:
    types: [published]

  # Manual runs ship a prerelease of the next patch version to nuget.org.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    permissions:
      contents: read
      packages: write # push to GitHub Package Registry
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal --logger GitHubActions
    - name: Determine version #Releases use the tag; everything else is a prerelease of the next patch after the latest release
      id: version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = "release" ]; then
          version="${GITHUB_REF_NAME#v}"
        else
          latest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          IFS=. read -r major minor patch <<< "${latest#v}"
          version="$major.$minor.$((patch + 1))-prerelease.$GITHUB_RUN_NUMBER"
        fi
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::'$version' is not a valid package version"
          exit 1
        fi
        echo "Package version: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Pack
      run: dotnet pack --configuration release --output ${{ github.workspace}}/artifact/ /p:Version=${{ steps.version.outputs.version }}

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: uploads
        path: ${{ github.workspace}}/artifact/
        if-no-files-found: error
    - name: Push to GitHub Package Registry
      if: ${{ github.ref == 'refs/heads/main' }}
      run: dotnet nuget push ${{ github.workspace}}/artifact/*.nupkg --source https://nuget.pkg.github.com/ctolkien/index.json --api-key ${{secrets.GITHUB_TOKEN}} --skip-duplicate

  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy
    environment: ${{ github.event_name == 'release' && 'Production' || 'PreRelease' }}
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write # OIDC token for NuGet trusted publishing
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: uploads
        path: ${{ github.workspace}}/artifact/
    - name: NuGet login (OIDC to temp API key)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ctolkien # nuget.org profile name, not email
    - name: Push to NuGet Package Registry
      run: dotnet nuget push ${{ github.workspace}}/artifact/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
